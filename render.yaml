services:
  - type: web
    name: skysurvey-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CACHE_DIR
        value: /tmp/fits_cache
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: skysurvey
